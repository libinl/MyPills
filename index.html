<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Pills</title>
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Pills">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1d2321; --muted:#6b726f; --line:#e3e0d8;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#b4541f; --warn-soft:#fbeadf;
  --done:#2f6f5e; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141716;--card:#1e2220;--ink:#eef1ef;--muted:#9aa29e;--line:#2e3431;
  --accent:#6cc1a5;--accent-soft:#1f3a31;--warn:#f0a070;--warn-soft:#3a2619;--done:#6cc1a5;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}
header .date{color:var(--muted);font-size:15px}
.sync{font-size:12px;color:var(--muted);margin-top:4px}
.sync.bad{color:var(--warn)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.slot{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.name{font-size:20px;font-weight:650;margin:2px 0}
.sub{color:var(--muted);font-size:14px}
.pillno{font-variant-numeric:tabular-nums;font-weight:700}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
.btn{background:var(--accent);color:#fff;padding:14px 18px;font-weight:650;font-size:17px;width:100%;margin-top:12px}
@media (prefers-color-scheme: dark){.btn{color:#0d1a15}}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;margin-top:0}
.link{background:none;color:var(--muted);text-decoration:underline;padding:4px;font-size:14px}
.taken{border-color:var(--accent);background:var(--accent-soft)}
.taken .tick{width:40px;height:40px;border-radius:50%;background:var(--done);color:var(--card);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.off{opacity:.6}
.alert{border-color:var(--warn);background:var(--warn-soft)}
.alert .slot{color:var(--warn)}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btnrow .btn{margin-top:0;flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;padding:12px 4px 10px;color:var(--muted);font-size:13px;font-weight:600;border-radius:0}
nav button .ic{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--accent)}
/* pack grid */
.pack{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.used{background:var(--line);color:var(--muted);text-decoration:line-through;border-color:transparent}
.cell.next{border:2.5px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.big{font-size:44px;font-weight:750;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
/* history */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left;white-space:nowrap}
.ok{color:var(--done);font-weight:700}.miss{color:var(--warn);font-weight:700}.na{color:var(--line)}
/* forms */
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 4px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h3{margin:0 0 8px;font-size:20px}
.hidden{display:none}
.note{font-size:14px;color:var(--muted)}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Today</h1>
    <div class="date" id="today"></div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="main"></main>
</div>
<nav><div class="in">
  <button data-tab="today" class="on"><span class="ic">💊</span>Today</button>
  <button data-tab="pack"><span class="ic">▦</span>Pack check</button>
  <button data-tab="history"><span class="ic">🗓</span>History</button>
  <button data-tab="settings"><span class="ic">⚙︎</span>Settings</button>
</div></nav>
<div id="dlg"></div>
<input type="file" id="filepick" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">

<script>
(function(){
"use strict";
const LS_KEY = "mypills-state-v1";
let state = null, tab = "today";

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const dayDiff = (a, b) => { const A = parseKey(a), B = parseKey(b);
  return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5); };
const fmtDay = k => parseKey(k).toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
const fmtHM = hm => { const [h,m] = hm.split(":").map(Number); const d = new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- schedule logic ---------- */
function isDue(med, k){
  if (k < med.since) return false;
  const n = Math.max(1, med.every|0);
  if (n === 1) return true;
  const d = dayDiff(med.anchor, k);
  return ((d % n) + n) % n === 0;
}
function nextDue(med, fromKey){
  for (let i=0;i<400;i++){ const k = addDays(fromKey, i); if (isDue(med,k)) return k; }
  return null;
}
const entryFor = (medId, k) => state.log.find(e => e.med === medId && e.date === k);

/* ---------- defaults ---------- */
function defaultState(){
  const t = todayKey();
  return { v:1, setupDone:false, meds:[
    {id:uid(), name:"Morning tablet", slot:"Morning", time:"08:00", every:1, anchor:t, since:t, packSize:28, nextPill:1},
    {id:uid(), name:"Lunch tablet",   slot:"Lunch",   time:"12:30", every:1, anchor:t, since:t, packSize:28, nextPill:1},
    {id:uid(), name:"Night tablet",   slot:"Night (every 2nd night)", time:"21:00", every:2, anchor:t, since:t, packSize:28, nextPill:1}
  ], log:[] };
}

/* ---------- storage ---------- */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function persist(){
  const cutoff = addDays(todayKey(), -200);
  state.log = state.log.filter(e => e.date >= cutoff);
  state.updated = new Date().toISOString();
  saveLocal(); showSyncLine();
}
function setting(k, v){ try{ if (v === undefined) return localStorage.getItem("mypills-"+k); localStorage.setItem("mypills-"+k, v); }catch(e){ return null; } }
function showSyncLine(){
  const el = document.getElementById("sync"); if (!el) return;
  const last = setting("lastExport");
  const changed = last && state.updated && state.updated > last;
  el.className = "sync" + (changed ? " bad" : "");
  el.textContent = !last ? "Saved on this phone · not exported yet"
    : changed ? "Saved on this phone · changes since last export (" + fmtDay(keyOf(new Date(last))) + ")"
    : "Saved on this phone · exported " + fmtDay(keyOf(new Date(last)));
}

/* ---------- actions ---------- */
function takeDose(med, k){
  if (entryFor(med.id, k)) return; // never double-log
  if (med.nextPill > med.packSize) { askNewPack(med, () => takeDose(med, k)); return; }
  state.log.push({id:uid(), med:med.id, date:k, at:new Date().toISOString(), pill:med.nextPill});
  med.nextPill++;
  persist(); render();
}
function skipDose(med, k){
  if (entryFor(med.id, k)) return;
  state.log.push({id:uid(), med:med.id, date:k, at:new Date().toISOString(), skipped:true});
  persist(); render();
}
function undo(med, k){
  const e = entryFor(med.id, k); if (!e) return;
  confirmSheet("Undo this?",
    e.skipped ? `Remove the “skipped” note for ${esc(med.name)} on ${fmtDay(k)}.`
              : `This marks ${esc(med.name)} (pill #${e.pill}) as <b>not taken</b> and puts the pack count back to #${e.pill}. Only do this if you tapped by mistake.`,
    "Yes, undo", () => {
      state.log = state.log.filter(x => x !== e); (state.removed = state.removed || []).push(e.id);
      if (!e.skipped && e.pill === med.nextPill - 1) med.nextPill--;
      persist(); render();
    });
}
function askNewPack(med, then){
  confirmSheet("Pack finished",
    `All ${med.packSize} pills of ${esc(med.name)} are used. Start a new pack? The count goes back to pill #1.`,
    "Start new pack", () => { med.nextPill = 1; med.packReset = new Date().toISOString(); persist(); if (then) then(); else render(); });
}

/* ---------- dialog ---------- */
function closeDlg(){ document.getElementById("dlg").innerHTML = ""; }
function confirmSheet(title, html, okText, onOk){
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>${title}</h3><p class="note">${html}</p>
    <div class="btnrow"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>${okText}</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector(".scrim").onclick = ev => { if (ev.target.classList.contains("scrim")) closeDlg(); };
  d.querySelector("[data-ok]").onclick = () => { closeDlg(); onOk(); };
}
function numberSheet(med){
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>Match the pack</h3>
    <p class="note">Look at your ${esc(med.name)} pack. What number is the <b>next full pill</b> (the one you'd take next)?</p>
    <label>Next pill number</label><input type="number" inputmode="numeric" min="1" max="${med.packSize+1}" value="${med.nextPill}" id="np">
    <div class="btnrow"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>Save</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector("[data-ok]").onclick = () => {
    const v = parseInt(d.querySelector("#np").value, 10);
    if (v >= 1 && v <= med.packSize + 1){ med.nextPill = v; med.packReset = new Date().toISOString(); persist(); }
    closeDlg(); render();
  };
}

/* ---------- views ---------- */
function viewToday(){
  const t = todayKey();
  const meds = [...state.meds].sort((a,b) => a.time.localeCompare(b.time));
  let html = "";

  // Not-recorded doses from the last 3 days
  const gaps = [];
  for (let i=3;i>=1;i--){ const k = addDays(t,-i);
    meds.forEach(m => { if (isDue(m,k) && !entryFor(m.id,k)) gaps.push({m,k}); }); }
  if (gaps.length){
    html += `<h2>Not recorded</h2>`;
    gaps.forEach(({m,k},i) => {
      html += `<div class="card alert"><div class="slot">${fmtDay(k)} · ${esc(m.slot)}</div>
        <div class="name">${esc(m.name)}</div>
        <div class="sub">Check your pack: if pill <span class="pillno">#${m.nextPill}</span> is already gone, you took it.</div>
        <div class="btnrow"><button class="btn small" data-gap-take="${i}">I took it</button>
        <button class="btn small ghost" data-gap-skip="${i}">I missed it</button></div></div>`;
    });
  }

  html += `<h2>Today</h2>`;
  meds.forEach(m => {
    const due = isDue(m,t), e = entryFor(m.id,t);
    if (!due){
      const nd = nextDue(m, t);
      html += `<div class="card off"><div class="slot">${esc(m.slot)}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">Not today · next dose ${nd ? (nd===addDays(t,1) ? "tomorrow" : fmtDay(nd)) : "—"} at ${fmtHM(m.time)}</div></div>`;
    } else if (e && !e.skipped){
      html += `<div class="card taken"><div class="row"><div class="tick">✓</div><div class="grow">
        <div class="slot">${esc(m.slot)}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">Taken at ${fmtTime(e.at)} · pill <span class="pillno">#${e.pill}</span></div></div></div>
        <div style="text-align:right"><button class="link" data-undo="${m.id}">Tapped by mistake?</button></div></div>`;
    } else if (e && e.skipped){
      html += `<div class="card alert"><div class="slot">${esc(m.slot)}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">Marked as missed</div><div style="text-align:right"><button class="link" data-undo="${m.id}">Undo</button></div></div>`;
    } else {
      const over = m.nextPill > m.packSize;
      html += `<div class="card"><div class="slot">${esc(m.slot)} · ${fmtHM(m.time)}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">${over ? "Pack finished — you'll start a new pack" : `Take pill <span class="pillno">#${m.nextPill}</span> of ${m.packSize}`}</div>
        <button class="btn" data-take="${m.id}">${over ? "Start new pack & take #1" : `I've taken pill #${m.nextPill}`}</button></div>`;
    }
  });
  const main = document.getElementById("main"); main.innerHTML = html;
  main.querySelectorAll("[data-take]").forEach(b => b.onclick = () => takeDose(med(b.dataset.take), t));
  main.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => undo(med(b.dataset.undo), t));
  main.querySelectorAll("[data-gap-take]").forEach(b => b.onclick = () => { const g = gaps[+b.dataset.gapTake]; takeDose(g.m, g.k); });
  main.querySelectorAll("[data-gap-skip]").forEach(b => b.onclick = () => { const g = gaps[+b.dataset.gapSkip]; skipDose(g.m, g.k); });
}

function viewPack(){
  let html = `<p class="note" style="margin:16px 4px 0">Hold each pack and compare. Crossed-out pills should be empty on your pack; the circled one is the next to take.</p>`;
  state.meds.forEach(m => {
    const used = Math.min(m.nextPill - 1, m.packSize);
    let cells = "";
    for (let i=1;i<=m.packSize;i++){
      cells += `<div class="cell ${i < m.nextPill ? "used" : (i === m.nextPill ? "next" : "")}">${i}</div>`;
    }
    const last = state.log.filter(e => e.med === m.id && !e.skipped).sort((a,b)=>b.at.localeCompare(a.at))[0];
    html += `<h2>${esc(m.slot)}</h2><div class="card">
      <div class="row"><div class="grow"><div class="name">${esc(m.name)}</div>
      <div class="sub">${used} of ${m.packSize} used${last ? ` · last taken ${fmtDay(last.date)} ${fmtTime(last.at)}` : ""}</div></div>
      <div style="text-align:right"><div class="sub">Next pill</div><div class="big">${m.nextPill > m.packSize ? "✓" : "#"+m.nextPill}</div></div></div>
      <div class="pack">${cells}</div>
      <div class="btnrow"><button class="btn small ghost" data-fix="${m.id}">Pack doesn't match</button>
      <button class="btn small ghost" data-new="${m.id}">Started a new pack</button></div></div>`;
  });
  const main = document.getElementById("main"); main.innerHTML = html;
  main.querySelectorAll("[data-fix]").forEach(b => b.onclick = () => numberSheet(med(b.dataset.fix)));
  main.querySelectorAll("[data-new]").forEach(b => b.onclick = () => {
    const m = med(b.dataset.new);
    confirmSheet("New pack", `Reset ${esc(m.name)} to pill #1?`, "Reset to #1", () => { m.nextPill = 1; m.packReset = new Date().toISOString(); persist(); render(); });
  });
}

function viewHistory(){
  const t = todayKey();
  const meds = [...state.meds].sort((a,b) => a.time.localeCompare(b.time));
  let rows = "", taken = 0, due = 0;
  for (let i=0;i<21;i++){
    const k = addDays(t,-i);
    rows += `<tr><td>${i===0 ? "Today" : fmtDay(k)}</td>` + meds.map(m => {
      if (!isDue(m,k)) return `<td class="na">–</td>`;
      const e = entryFor(m.id,k);
      if (i>0 || e) due++;
      if (e && !e.skipped){ taken++; return `<td class="ok">✓ #${e.pill}</td>`; }
      if (e && e.skipped) return `<td class="miss">missed</td>`;
      return i===0 ? `<td class="na">…</td>` : `<td class="miss">?</td>`;
    }).join("") + `</tr>`;
  }
  const pct = due ? Math.round(taken/due*100) : 100;
  document.getElementById("main").innerHTML = `
    <div class="card" style="margin-top:16px"><div class="row"><div class="grow"><div class="name">Last 3 weeks</div>
    <div class="sub">${taken} of ${due} doses recorded as taken</div></div><div class="big">${pct}%</div></div></div>
    <div class="card"><table><thead><tr><th>Day</th>${meds.map(m=>`<th>${esc(m.slot.split(" ")[0])}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note">✓ #7 = taken, pill number 7 · ? = not recorded · – = not due that day</p></div>`;
}

function viewSettings(){
  const first = !state.setupDone;
  let html = first ? `<div class="card" style="margin-top:16px;border-color:var(--accent)"><div class="name">Welcome 👋</div>
    <p class="note">Have a My Pills data file from your other phone? Import it and you're done:</p>
    <button class="btn" data-import>Import data file</button>
    <div style="text-align:center;margin-top:6px"><button class="link" data-paste>File won't open? Paste the text instead</button></div>
    <p class="note">Or set up your medicines below. For each pack, enter how many pills it holds and the number of the <b>next full pill</b> on the pack right now.</p></div>` : syncCardHtml();
  state.meds.forEach((m,idx) => {
    const nd = m.every > 1 ? nextDue(m, todayKey()) : todayKey();
    html += `<div class="card" data-med="${m.id}">
      <div class="row"><div class="grow name" style="font-size:17px">Medicine ${idx+1}</div>
      ${state.meds.length>1 ? `<button class="link" data-del="${m.id}">Remove</button>` : ""}</div>
      <label>Name</label><input data-f="name" value="${esc(m.name)}">
      <div class="two"><div><label>Label</label><input data-f="slot" value="${esc(m.slot)}"></div>
      <div><label>Time</label><input type="time" data-f="time" value="${m.time}"></div></div>
      <div class="two"><div><label>Start date</label><input type="date" data-f="since" value="${m.since}"></div><div></div></div>
      <div class="two"><div><label>How often</label><select data-f="every">
        ${[1,2,3,7].map(n=>`<option value="${n}" ${m.every==n?"selected":""}>${n===1?"Every day":n===2?"Every 2nd day":n===7?"Once a week":"Every "+n+" days"}</option>`).join("")}
      </select></div>
      <div class="${m.every>1?"":"hidden"}" data-anchorbox><label>Next dose date</label><input type="date" data-f="anchor" value="${nd}"></div></div>
      <div class="two"><div><label>Pills per pack</label><input type="number" inputmode="numeric" min="1" max="200" data-f="packSize" value="${m.packSize}"></div>
      <div><label>Next pill # on pack</label><input type="number" inputmode="numeric" min="1" data-f="nextPill" value="${m.nextPill}"></div></div>
    </div>`;
  });
  html += `<button class="btn ghost" id="add">+ Add another medicine</button>
    <button class="btn" id="save">${first ? "Save & start" : "Save changes"}</button>
    <h2>Reminders</h2><div class="card"><p class="note" style="margin-top:0">This app can't buzz your phone when it's closed, so let your phone's own alarms do that.</p>
    <ol class="steps note">
      
      <li><b>Morning &amp; lunch:</b> set two daily alarms in the Clock app.</li>
      <li><b>Every 2nd night:</b> Clock alarms can't skip days, so use the Reminders app (iPhone: Repeat → Custom → every 2 days) or Google Calendar / Google Tasks (Repeat → Custom → every 2 days).</li>
      <li>When it goes off: take the pill, open My Pills, tap the button. The pill number shown should match the pack in your hand.</li>
    </ol></div>`;
  const main = document.getElementById("main"); main.innerHTML = html;
  wireSync(main);
  main.querySelectorAll("select[data-f=every]").forEach(s => s.onchange = () => {
    s.closest(".card").querySelector("[data-anchorbox]").classList.toggle("hidden", s.value === "1");
  });
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const m = med(b.dataset.del);
    confirmSheet("Remove medicine?", `Remove ${esc(m.name)} and its history?`, "Remove", () => {
      state.meds = state.meds.filter(x => x !== m); state.removed = (state.removed||[]).concat(state.log.filter(e => e.med === m.id).map(e => e.id)); state.log = state.log.filter(e => e.med !== m.id); persist(); render();
    });
  });
  main.querySelector("#add").onclick = () => { collect(); const t = todayKey();
    state.meds.push({id:uid(), name:"New medicine", slot:"Evening", time:"18:00", every:1, anchor:t, since:t, packSize:28, nextPill:1}); render(); };
  main.querySelector("#save").onclick = () => { collect(); state.setupDone = true; persist(); tab = "today"; render(); };
}
function collect(){
  document.querySelectorAll("[data-med]").forEach(card => {
    const m = med(card.dataset.med); if (!m) return;
    const v = f => card.querySelector(`[data-f=${f}]`).value;
    m.name = v("name").trim() || "Medicine";
    m.slot = v("slot").trim() || "Dose";
    m.time = v("time") || "08:00";
    m.every = Math.max(1, parseInt(v("every"),10) || 1);
    const since = v("since");
    const sinceChanged = since && since !== m.since;
    if (since) m.since = since;
    if (m.every > 1) {
      // a new start date is also the first dose day; otherwise use "Next dose date"
      if (sinceChanged) m.anchor = m.since;
      else if (v("anchor")) m.anchor = v("anchor");
    }
    m.packSize = Math.max(1, parseInt(v("packSize"),10) || 28);
    const np = Math.min(m.packSize + 1, Math.max(1, parseInt(v("nextPill"),10) || 1));
    if (np !== m.nextPill){ m.nextPill = np; m.packReset = new Date().toISOString(); }
  });
}
const med = id => state.meds.find(m => m.id === id);

/* ---------- shell ---------- */
const titles = {today:"Today", pack:"Pack check", history:"History", settings:"Settings"};
function render(){
  if (!state) return;
  if (!state.setupDone) tab = "settings";
  document.getElementById("title").textContent = titles[tab];
  document.getElementById("today").textContent = new Date().toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long"});
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({today:viewToday, pack:viewPack, history:viewHistory, settings:viewSettings})[tab]();
  showSyncLine();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  if (!state.setupDone && b.dataset.tab !== "settings") return;
  tab = b.dataset.tab; render(); window.scrollTo(0,0);
});
// refresh when the day changes or the app comes back to the front
let lastDay = todayKey();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayKey() !== lastDay){ lastDay = todayKey(); render(); } });
setInterval(() => { if (todayKey() !== lastDay){ lastDay = todayKey(); render(); } }, 60000);

/* ---------- export / import ---------- */
function deviceName(){ return setting("device") || ""; }
function syncCardHtml(){
  const last = setting("lastExport"), lastIn = setting("lastImport");
  return `<h2>Sync between phones</h2><div class="card">
    <p class="note" style="margin-top:0">Data is kept on this phone only. To copy it to your other phone: <b>Export</b> here, send the file to the other phone (WhatsApp, WeChat, email, AirDrop/Files…), then <b>Import</b> it there. Importing combines both phones' records — nothing is lost.</p>
    <label>This phone's name</label><input id="devname" placeholder="e.g. iPhone or Android" value="${esc(deviceName())}">
    <div class="btnrow" style="margin-top:12px"><button class="btn" data-export>Export / send data</button><button class="btn ghost" data-import>Import data file</button></div>
    <p class="note">Last export: ${last ? fmtDay(keyOf(new Date(last)))+" "+fmtTime(last) : "never"} · Last import: ${lastIn ? fmtDay(keyOf(new Date(lastIn)))+" "+fmtTime(lastIn) : "never"}</p>
    <div style="text-align:right"><button class="link" data-paste>Import by pasting text instead</button></div>
  </div>`;
}
function wireSync(root){
  const dn = root.querySelector("#devname");
  if (dn) dn.onchange = () => { setting("device", dn.value.trim()); };
  root.querySelectorAll("[data-export]").forEach(b => b.onclick = exportData);
  root.querySelectorAll("[data-import]").forEach(b => b.onclick = pickFile);
  root.querySelectorAll("[data-paste]").forEach(b => b.onclick = pasteSheet);
}
function exportPayload(){
  return { app:"mypills", format:1, exportedAt:new Date().toISOString(), device:deviceName() || "phone", state };
}
async function exportData(){
  const dn = document.querySelector("#devname"); if (dn) setting("device", dn.value.trim());
  const p = exportPayload(), text = JSON.stringify(p, null, 1);
  const dev = (deviceName() || "phone").replace(/[^A-Za-z0-9_-]+/g,"-");
  const t = new Date(), fname = `mypills-${dev}-${keyOf(t)}-${pad(t.getHours())}${pad(t.getMinutes())}.json`;
  const markDone = () => { setting("lastExport", state.updated || new Date().toISOString()); render(); };
  let file = null;
  try { file = new File([text], fname, {type:"application/json"}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:"My Pills data"}); markDone(); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  // fallback: download + copy option
  try {
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch(e){}
  markDone();
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>Exported</h3>
    <p class="note">The file <b>${esc(fname)}</b> was saved to your Downloads. If you can't find it, copy the data as text and paste it into a message to yourself instead.</p>
    <div class="btnrow"><button class="btn ghost" data-copy>Copy as text</button><button class="btn" data-x>Done</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector("[data-copy]").onclick = async (ev) => {
    try { await navigator.clipboard.writeText(text); ev.target.textContent = "Copied ✓"; } catch(e){ ev.target.textContent = "Couldn't copy"; }
  };
}
function pickFile(){
  // A real input kept in the page, with no file-type filter: some phones grey out
  // .json files or ignore a picker that isn't attached to the page.
  const inp = document.getElementById("filepick");
  inp.value = "";
  inp.click();
}
function onFilePicked(){
  const inp = document.getElementById("filepick");
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => handleImport(String(r.result));
  r.onerror = () => importError("Couldn't read that file. Try “Paste text instead”.");
  r.readAsText(f);
}
function pasteSheet(){
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>Paste data</h3>
    <p class="note">Open the data file (or the message it came in), select all of its text, copy it, and paste it here. It starts with <code>{"app":"mypills"</code>.</p>
    <textarea id="pastebox" style="width:100%;height:140px;font:13px monospace;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px"></textarea>
    <div class="btnrow"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>Import</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector("[data-ok]").onclick = () => { const t = d.querySelector("#pastebox").value; closeDlg(); handleImport(t); };
}
function importError(msg){ confirmSheet("Import failed", esc(msg), "OK", () => {}); }
function validState(s){
  return s && Array.isArray(s.meds) && Array.isArray(s.log) &&
    s.meds.every(m => m && typeof m.id === "string" && typeof m.name === "string" && Number.isFinite(+m.packSize) && Number.isFinite(+m.nextPill)) &&
    s.log.every(e => e && typeof e.id === "string" && typeof e.med === "string" && /^\d{4}-\d\d-\d\d$/.test(e.date));
}
function handleImport(text){
  let p; try { p = JSON.parse(text.trim()); } catch(e){ return importError("That doesn't look like a My Pills data file."); }
  const inc = p && p.app === "mypills" ? p.state : p; // also accept a bare state
  if (!validState(inc)) return importError("That doesn't look like a My Pills data file.");
  inc.setupDone = true;
  const doses = inc.log.filter(e => !e.skipped).length;
  const when = p.exportedAt ? fmtDay(keyOf(new Date(p.exportedAt))) + " " + fmtTime(p.exportedAt) : "unknown time";
  const finish = (newState, how) => {
    state = newState; state.updated = new Date().toISOString(); saveLocal();
    setting("lastImport", new Date().toISOString());
    tab = "pack"; render();
    confirmSheet("Imported ✓", `${how}. Please check the pill numbers on the Pack check screen against your packs.`, "OK", () => {});
  };
  const d = document.getElementById("dlg");
  const fresh = !state.setupDone;
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>Import data</h3>
    <p class="note">From <b>${esc(p.device || "another phone")}</b>, exported ${when}: ${inc.meds.length} medicine${inc.meds.length===1?"":"s"}, ${doses} dose${doses===1?"":"s"} recorded.</p>
    ${fresh ? "" : `<p class="note"><b>Combine</b> keeps every dose recorded on either phone (recommended). <b>Replace</b> throws away this phone's data and uses the file only.</p>`}
    <div class="btnrow">${fresh ? `<button class="btn ghost" data-x>Cancel</button><button class="btn" data-merge>Import</button>`
      : `<button class="btn ghost" data-replace>Replace</button><button class="btn" data-merge>Combine</button>`}</div>
    ${fresh ? "" : `<div style="text-align:center;margin-top:8px"><button class="link" data-x>Cancel</button></div>`}</div></div>`;
  d.querySelectorAll("[data-x]").forEach(b => b.onclick = closeDlg);
  d.querySelector("[data-merge]").onclick = () => { closeDlg(); finish(mergeStates(state, JSON.parse(JSON.stringify(inc))), fresh ? "Data imported" : "Both phones' records combined"); };
  const rb = d.querySelector("[data-replace]");
  if (rb) rb.onclick = () => { closeDlg(); confirmSheet("Replace this phone's data?", "Any doses recorded only on this phone will be lost.", "Replace", () => finish(JSON.parse(JSON.stringify(inc)), "Data replaced")); };
}

/* ---------- merge two phones' data ---------- */
// Doses recorded on either phone are kept (nothing is lost if one phone was offline).
// Undos are remembered so they don't come back. Medicine settings come from whichever was saved last.
function mergeStates(local, remote){
  if (!local || !local.setupDone) return remote;
  if (!remote || !remote.setupDone) return local;
  const newer = (remote.updated || "") >= (local.updated || "") ? remote : local;
  const out = JSON.parse(JSON.stringify(newer));
  const removed = new Set([...(local.removed||[]), ...(remote.removed||[])]);
  const byKey = new Map();
  [...newer.log, ...(newer === remote ? local.log : remote.log)].forEach(e => {
    if (removed.has(e.id)) return;
    const k = e.med + "|" + e.date;           // one entry per medicine per day
    if (!byKey.has(k)) byKey.set(k, e);
  });
  out.log = [...byKey.values()];
  out.removed = [...removed].slice(-300);
  out.updated = newer.updated;
  // pack count must be past every pill recorded on either phone
  out.meds.forEach(m => {
    out.log.forEach(e => { if (e.med === m.id && !e.skipped && e.pill >= m.nextPill && e.at > (m.packReset || "")) m.nextPill = e.pill + 1; });
  });
  return out;
}

/* ---------- boot ---------- */
state = loadLocal() || defaultState();
document.getElementById("filepick").addEventListener("change", onFilePicked);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
})();
</script>
</body>
</html>
