<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Pills</title>
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Pills">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1d2321; --muted:#6b726f; --line:#e3e0d8;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#b4541f; --warn-soft:#fbeadf;
  --done:#2f6f5e; --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141716;--card:#1e2220;--ink:#eef1ef;--muted:#9aa29e;--line:#2e3431;
  --accent:#6cc1a5;--accent-soft:#1f3a31;--warn:#f0a070;--warn-soft:#3a2619;--done:#6cc1a5;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}
header .date{color:var(--muted);font-size:15px}
.sync{font-size:12px;color:var(--muted);margin-top:4px}
.sync.bad{color:var(--warn)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.slot{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.name{font-size:20px;font-weight:650;margin:2px 0}
.sub{color:var(--muted);font-size:14px}
.pillno{font-variant-numeric:tabular-nums;font-weight:700}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
.btn{background:var(--accent);color:#fff;padding:14px 18px;font-weight:650;font-size:17px;width:100%;margin-top:12px}
@media (prefers-color-scheme: dark){.btn{color:#0d1a15}}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;margin-top:0}
.link{background:none;color:var(--muted);text-decoration:underline;padding:4px;font-size:14px}
.taken{border-color:var(--accent);background:var(--accent-soft)}
.taken .tick{width:40px;height:40px;border-radius:50%;background:var(--done);color:var(--card);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.off{opacity:.6}
.alert{border-color:var(--warn);background:var(--warn-soft)}
.alert .slot{color:var(--warn)}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btnrow .btn{margin-top:0;flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;padding:12px 4px 10px;color:var(--muted);font-size:13px;font-weight:600;border-radius:0}
nav button .ic{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--accent)}
/* pack grid */
.pack{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.used{background:var(--line);color:var(--muted);text-decoration:line-through;border-color:transparent}
.cell.next{border:2.5px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.big{font-size:44px;font-weight:750;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
/* history */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left;white-space:nowrap}
.ok{color:var(--done);font-weight:700}.miss{color:var(--warn);font-weight:700}.na{color:var(--line)}
/* forms */
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 4px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h3{margin:0 0 8px;font-size:20px}
.hidden{display:none}
.lang{display:flex;gap:6px;margin-top:10px}
.lang button{flex:1;padding:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:15px}
.lang button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.err{color:var(--warn);font-size:14px;font-weight:600;margin-top:8px}
input.bad{border-color:var(--warn)}
.empty{text-align:center;padding:28px 16px}
.empty .ic{font-size:40px}
.note{font-size:14px;color:var(--muted)}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Today</h1>
    <div class="date" id="today"></div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="main"></main>

  <button data-tab="history"><span class="ic">🗓</span><span data-t="navHistory">History</span></button>
  <button data-tab="settings"><span class="ic">⚙︎</span><span data-t="navSettings">Settings</span></button>
</div></nav>
<div id="dlg"></div>
<input type="file" id="filepick" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">

  return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5); };

const fmtHM = hm => { const [h,m] = hm.split(":").map(Number); const d = new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString(loc(),{hour:"numeric",minute:"2-digit"}); };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- schedule logic ---------- */
function isDue(med, k){
  if (k < med.since) return false;
  const n = Math.max(1, med.every|0);
  if (n === 1) return true;
  const d = dayDiff(med.anchor, k);
  return ((d % n) + n) % n === 0;
}
function nextDue(med, fromKey){
  for (let i=0;i<400;i++){ const k = addDays(fromKey, i); if (isDue(med,k)) return k; }
  return null;
}
const entryFor = (medId, k) => state.log.find(e => e.med === medId && e.date === k);
const med = id => state.meds.find(m => m.id === id);
// An empty label means "automatic": named from the time, in the current language.
function slotFor(m){
  if (m.slot && m.slot.trim()) return m.slot;
  const h = parseInt((m.time||"08:00").split(":")[0],10);
  return t(h < 11 ? "slotMorning" : h < 14 ? "slotLunch" : h < 17 ? "slotAfternoon" : h < 20 ? "slotEvening" : h < 22 ? "slotNight" : "slotBedtime");
}
const byTime = () => [...state.meds].sort((a,b) => a.time.localeCompare(b.time));

/* ---------- defaults ---------- */
function defaultState(){ return { v:1, setupDone:false, meds:[], log:[] }; }
function newMed(){
  const t0 = todayKey();
  return {id:uid(), name:"", slot:"", time:"08:00", every:1, anchor:t0, since:t0, packSize:28, nextPill:1};
}

/* ---------- storage ---------- */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function persist(){
  const cutoff = addDays(todayKey(), -200);
  state.log = state.log.filter(e => e.date >= cutoff);
  state.updated = new Date().toISOString();
  saveLocal(); showSyncLine();
}
function showSyncLine(){
  const el = document.getElementById("sync"); if (!el) return;
  if (!state.setupDone){ el.textContent = ""; return; }
  const last = setting("lastExport");
  const changed = last && state.updated && state.updated > last;
  el.className = "sync" + (changed ? " bad" : "");
  el.textContent = !last ? t("savedNoExport")
    : changed ? t("savedChanged",{d:fmtDay(keyOf(new Date(last)))})
    : t("savedExported",{d:fmtDay(keyOf(new Date(last)))});
}

/* ---------- actions ---------- */
function takeDose(m, k){
  if (entryFor(m.id, k)) return; // never double-log
  if (m.nextPill > m.packSize) { askNewPack(m, () => takeDose(m, k)); return; }
  state.log.push({id:uid(), med:m.id, date:k, at:new Date().toISOString(), pill:m.nextPill});
  m.nextPill++;
  persist(); render();
}
function skipDose(m, k){
  if (entryFor(m.id, k)) return;
  state.log.push({id:uid(), med:m.id, date:k, at:new Date().toISOString(), skipped:true});
  persist(); render();
}
function undo(m, k){
  const e = entryFor(m.id, k); if (!e) return;
  confirmSheet(t("undoTitle"),
    e.skipped ? t("undoSkip",{m:esc(m.name), d:fmtDay(k)}) : t("undoTaken",{m:esc(m.name), n:e.pill}),
    t("yesUndo"), () => {
      state.log = state.log.filter(x => x !== e); (state.removed = state.removed || []).push(e.id);
      if (!e.skipped && e.pill === m.nextPill - 1) m.nextPill--;
      persist(); render();
    });
}
function askNewPack(m, then){
  confirmSheet(t("packFinished"), t("packFinishedBody",{s:m.packSize, m:esc(m.name)}), t("startNewPack"),
    () => { m.nextPill = 1; m.packReset = new Date().toISOString(); persist(); if (then) then(); else render(); });
}

/* ---------- dialog ---------- */
function closeDlg(){ document.getElementById("dlg").innerHTML = ""; }
function confirmSheet(title, html, okText, onOk, noCancel){
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>${title}</h3><p class="note">${html}</p>
    <div class="btnrow">${noCancel ? "" : `<button class="btn ghost" data-x>${t("cancel")}</button>`}<button class="btn" data-ok>${okText}</button></div></div></div>`;
  const x = d.querySelector("[data-x]"); if (x) x.onclick = closeDlg;
  d.querySelector(".scrim").onclick = ev => { if (ev.target.classList.contains("scrim")) closeDlg(); };
  d.querySelector("[data-ok]").onclick = () => { closeDlg(); onOk(); };
}
function infoSheet(title, html){ confirmSheet(title, html, t("ok"), () => {}, true); }
function numberSheet(m){
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>${t("matchPack")}</h3>
    <p class="note">${t("matchPackBody",{m:esc(m.name)})}</p>
    <label>${t("nextPillNumber")}</label><input type="number" inputmode="numeric" min="1" max="${m.packSize+1}" value="${m.nextPill}" id="np">
    <div class="btnrow"><button class="btn ghost" data-x>${t("cancel")}</button><button class="btn" data-ok>${t("save")}</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector("[data-ok]").onclick = () => {
    const v = parseInt(d.querySelector("#np").value, 10);
    if (v >= 1 && v <= m.packSize + 1){ m.nextPill = v; m.packReset = new Date().toISOString(); persist(); }
    closeDlg(); render();
  };
}

/* ---------- views ---------- */
function emptyHtml(){
  return `<div class="card empty" style="margin-top:16px"><div class="ic">💊</div><div class="name">${t("noMedsTitle")}</div>
    <p class="note">${t("noMedsBody")}</p><button class="btn" data-gosettings>${t("goSettings")}</button></div>`;
}
function wireEmpty(main){ const b = main.querySelector("[data-gosettings]"); if (b) b.onclick = () => { tab = "settings"; render(); }; }

function viewToday(){
  const main = document.getElementById("main");
  if (!state.meds.length){ main.innerHTML = emptyHtml(); wireEmpty(main); return; }
  const td = todayKey(), meds = byTime();
  let html = "";
  const gaps = [];
  for (let i=3;i>=1;i--){ const k = addDays(td,-i);
    meds.forEach(m => { if (isDue(m,k) && !entryFor(m.id,k)) gaps.push({m,k}); }); }
  if (gaps.length){
    html += `<h2>${t("notRecorded")}</h2>`;
    gaps.forEach(({m,k},i) => {
      html += `<div class="card alert"><div class="slot">${fmtDay(k)} · ${esc(slotFor(m))}</div>
        <div class="name">${esc(m.name)}</div>
        <div class="sub">${t("gapHint",{n:m.nextPill})}</div>
        <div class="btnrow"><button class="btn small" data-gap-take="${i}">${t("iTookIt")}</button>
        <button class="btn small ghost" data-gap-skip="${i}">${t("iMissedIt")}</button></div></div>`;
    });
  }
  html += `<h2>${t("today")}</h2>`;
  meds.forEach(m => {
    const due = isDue(m,td), e = entryFor(m.id,td);
    if (!due){
      const nd = nextDue(m, td);
      html += `<div class="card off"><div class="slot">${esc(slotFor(m))}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">${t("notToday",{d: nd ? (nd===addDays(td,1) ? t("tomorrow") : fmtDay(nd)) : "—", t:fmtHM(m.time)})}</div></div>`;
    } else if (e && !e.skipped){
      html += `<div class="card taken"><div class="row"><div class="tick">✓</div><div class="grow">
        <div class="slot">${esc(slotFor(m))}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">${t("takenAt",{t:fmtTime(e.at), n:e.pill})}</div></div></div>
        <div style="text-align:right"><button class="link" data-undo="${m.id}">${t("tappedByMistake")}</button></div></div>`;
    } else if (e && e.skipped){
      html += `<div class="card alert"><div class="slot">${esc(slotFor(m))}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">${t("markedMissed")}</div><div style="text-align:right"><button class="link" data-undo="${m.id}">${t("undo")}</button></div></div>`;
    } else {
      const over = m.nextPill > m.packSize;
      html += `<div class="card"><div class="slot">${esc(slotFor(m))} · ${fmtHM(m.time)}</div><div class="name">${esc(m.name)}</div>
        <div class="sub">${over ? t("packFinishedNew") : t("takePill",{n:m.nextPill, s:m.packSize})}</div>
        <button class="btn" data-take="${m.id}">${over ? t("startNewTake") : t("iTook",{n:m.nextPill})}</button></div>`;
    }
  });
  main.innerHTML = html;
  main.querySelectorAll("[data-take]").forEach(b => b.onclick = () => takeDose(med(b.dataset.take), td));
  main.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => undo(med(b.dataset.undo), td));
  main.querySelectorAll("[data-gap-take]").forEach(b => b.onclick = () => { const g = gaps[+b.dataset.gapTake]; takeDose(g.m, g.k); });
  main.querySelectorAll("[data-gap-skip]").forEach(b => b.onclick = () => { const g = gaps[+b.dataset.gapSkip]; skipDose(g.m, g.k); });
}

function viewPack(){
  const main = document.getElementById("main");
  if (!state.meds.length){ main.innerHTML = emptyHtml(); wireEmpty(main); return; }
  let html = `<p class="note" style="margin:16px 4px 0">${t("packIntro")}</p>`;
  byTime().forEach(m => {
    const used = Math.min(m.nextPill - 1, m.packSize);
    let cells = "";
    for (let i=1;i<=m.packSize;i++) cells += `<div class="cell ${i < m.nextPill ? "used" : (i === m.nextPill ? "next" : "")}">${i}</div>`;
    const last = state.log.filter(e => e.med === m.id && !e.skipped).sort((a,b)=>b.at.localeCompare(a.at))[0];
    html += `<h2>${esc(slotFor(m))}</h2><div class="card">
      <div class="row"><div class="grow"><div class="name">${esc(m.name)}</div>
      <div class="sub">${t("usedOf",{u:used, s:m.packSize})}${last ? t("lastTaken",{d:fmtDay(last.date), t:fmtTime(last.at)}) : ""}</div></div>
      <div style="text-align:right"><div class="sub">${t("nextPill")}</div><div class="big">${m.nextPill > m.packSize ? "✓" : "#"+m.nextPill}</div></div></div>
      <div class="pack">${cells}</div>
      <div class="btnrow"><button class="btn small ghost" data-fix="${m.id}">${t("packNoMatch")}</button>
      <button class="btn small ghost" data-new="${m.id}">${t("startedNewPack")}</button></div></div>`;
  });
  main.innerHTML = html;
  main.querySelectorAll("[data-fix]").forEach(b => b.onclick = () => numberSheet(med(b.dataset.fix)));
  main.querySelectorAll("[data-new]").forEach(b => b.onclick = () => {
    const m = med(b.dataset.new);
    confirmSheet(t("newPack"), t("resetBody",{m:esc(m.name)}), t("resetTo1"), () => { m.nextPill = 1; m.packReset = new Date().toISOString(); persist(); render(); });
  });
}

function viewHistory(){
  const main = document.getElementById("main");
  if (!state.meds.length){ main.innerHTML = emptyHtml(); wireEmpty(main); return; }
  const td = todayKey(), meds = byTime();
  let rows = "", taken = 0, due = 0;
  for (let i=0;i<21;i++){
    const k = addDays(td,-i);
    rows += `<tr><td>${i===0 ? t("today") : fmtDay(k)}</td>` + meds.map(m => {
      if (!isDue(m,k)) return `<td class="na">–</td>`;
      const e = entryFor(m.id,k);
      if (i>0 || e) due++;
      if (e && !e.skipped){ taken++; return `<td class="ok">✓ #${e.pill}</td>`; }
      if (e && e.skipped) return `<td class="miss">${t("missed")}</td>`;
      return i===0 ? `<td class="na">…</td>` : `<td class="miss">?</td>`;
    }).join("") + `</tr>`;
  }
  const pct = due ? Math.round(taken/due*100) : 100;
  main.innerHTML = `
    <div class="card" style="margin-top:16px"><div class="row"><div class="grow"><div class="name">${t("last3w")}</div>
    <div class="sub">${t("dosesTaken",{a:taken, b:due})}</div></div><div class="big">${pct}%</div></div></div>
    <div class="card"><table><thead><tr><th>${t("day")}</th>${meds.map(m=>`<th>${esc(m.name.split(" ")[0])}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note">${t("histKey")}</p></div>`;
}

function langPicker(){
  return `<div class="lang"><button data-lang="en" class="${lang==="en"?"on":""}">English</button><button data-lang="zh" class="${lang==="zh"?"on":""}">中文</button></div>`;
}
function medCardHtml(m, idx){
  const nd = m.every > 1 ? (nextDue(m, todayKey()) || m.anchor) : todayKey();
  const slots = ["slotMorning","slotLunch","slotAfternoon","slotEvening","slotNight","slotBedtime"].map(k => `<option value="${esc(t(k))}">`).join("");
  return `<div class="card" data-med="${m.id}">
    <div class="row"><div class="grow name" style="font-size:17px">${t("medicine",{n:idx+1})}</div>
    <button class="link" data-del="${m.id}">${t("remove")}</button></div>
    <label>${t("name")}</label><input data-f="name" value="${esc(m.name)}" placeholder="${esc(t("namePh"))}" class="${formError && !m.name.trim() ? "bad" : ""}">
    <div class="two"><div><label>${t("label")}</label><input data-f="slot" list="slotlist" value="${esc(m.slot)}" placeholder="${esc(slotFor({time:m.time}))}"><datalist id="slotlist">${slots}</datalist></div>
    <div><label>${t("time")}</label><input type="time" data-f="time" value="${m.time}"></div></div>
    <div class="two"><div><label>${t("howOften")}</label><select data-f="every">
      ${[1,2,3,7].map(n=>`<option value="${n}" ${m.every==n?"selected":""}>${t("every"+n)}</option>`).join("")}
    </select></div>
    <div><label>${t("startDate")}</label><input type="date" data-f="since" value="${m.since}"></div></div>
    <div class="${m.every>1 && state.setupDone ? "" : "hidden"}" data-anchorbox><label>${t("nextDoseDate")}</label><input type="date" data-f="anchor" value="${nd}"></div>
    <div class="two"><div><label>${t("perPack")}</label><input type="number" inputmode="numeric" min="1" max="200" data-f="packSize" value="${m.packSize}"></div>
    <div><label>${t("nextOnPack")}</label><input type="number" inputmode="numeric" min="1" data-f="nextPill" value="${m.nextPill}"></div></div>
    <p class="note" style="margin-bottom:0">${t("nextOnPackHint")}</p>
  </div>`;
}
function helpHtml(){
  return `<h2>${t("helpTitle")}</h2><div class="card"><ol class="steps note" style="margin-top:0">
    <li>${t("help1")}</li><li>${t("help2")}</li><li>${t("help3")}</li><li>${t("help4")}</li></ol>
    <p class="note"><b>${t("helpRemTitle")}:</b> ${t("helpRem")}</p><p class="note" style="margin-bottom:0">${t("helpKeep")}</p></div>`;
}
function viewSettings(){
  const first = !state.setupDone;
  let html = "";
  if (first){
    html += `<div class="card" style="margin-top:16px;border-color:var(--accent)"><div class="name">${t("welcome")}</div>
      <p class="note">${t("welcomeBody")}</p>
      <ol class="steps note"><li>${t("step1")}</li><li>${t("step2")}</li><li>${t("step3")}</li></ol>
      ${langPicker()}</div>`;
  } else {
    html += `<h2>${t("language")}</h2><div class="card" style="padding:12px">${langPicker()}</div>`;
  }
  html += `<h2>${t("medsTitle")}</h2>`;
  state.meds.forEach((m,idx) => { html += medCardHtml(m, idx); });
  html += `<button class="btn ghost" id="add">${state.meds.length ? t("addMed") : t("addFirstMed")}</button>
    ${formError ? `<div class="err">${formError}</div>` : ""}
    <button class="btn" id="save">${first ? t("saveStart") : t("saveChanges")}</button>`;
  if (first){
    html += `<h2>${t("haveFile")}</h2><div class="card"><button class="btn ghost" data-import style="margin-top:0">${t("importFile")}</button>
      <div style="text-align:center;margin-top:6px"><button class="link" data-paste>${t("pasteInstead")}</button></div></div>`;
  } else {
    html += syncCardHtml();
  }
  html += helpHtml();
  const main = document.getElementById("main"); main.innerHTML = html;
  wireSync(main);
  main.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
    collect(); lang = b.dataset.lang; setting("lang", lang);
    // translate untouched default labels on new, unsaved medicines
    render();
  });
  main.querySelectorAll("input[data-f=time]").forEach(inp => inp.onchange = () => {
    const sl = inp.closest(".card").querySelector("[data-f=slot]"); sl.placeholder = slotFor({time: inp.value});
  });
  main.querySelectorAll("select[data-f=every]").forEach(s => s.onchange = () => {
    if (state.setupDone) s.closest(".card").querySelector("[data-anchorbox]").classList.toggle("hidden", s.value === "1");
  });
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    collect();
    const m = med(b.dataset.del);
    const doRemove = () => {
      state.meds = state.meds.filter(x => x !== m);
      state.removed = (state.removed||[]).concat(state.log.filter(e => e.med === m.id).map(e => e.id));
      state.log = state.log.filter(e => e.med !== m.id);
      if (state.setupDone) persist(); render();
    };
    if (!m.name.trim() && !state.log.some(e => e.med === m.id)) doRemove();
    else confirmSheet(t("removeMedTitle"), t("removeMedBody",{m:esc(m.name)}), t("remove"), doRemove);
  });
  main.querySelector("#add").onclick = () => {
    collect(); formError = ""; state.meds.push(newMed()); render();
    const cards = document.querySelectorAll("[data-med]"); const last = cards[cards.length-1];
    if (last){ last.scrollIntoView({behavior:"smooth", block:"start"}); const n = last.querySelector("[data-f=name]"); if (n) setTimeout(() => n.focus(), 300); }
  };
  main.querySelector("#save").onclick = () => {
    collect();
    if (!state.meds.length){ formError = t("errNoMeds"); render(); return; }
    if (state.meds.some(m => !m.name.trim())){ formError = t("errName"); render(); return; }
    formError = ""; state.setupDone = true; persist(); tab = "today"; render(); window.scrollTo(0,0);
  };
}
function collect(){
  document.querySelectorAll("[data-med]").forEach(card => {
    const m = med(card.dataset.med); if (!m) return;
    const v = f => card.querySelector(`[data-f=${f}]`).value;
    m.name = v("name").trim();
    m.slot = v("slot").trim();
    m.time = v("time") || "08:00";
    const every = Math.max(1, parseInt(v("every"),10) || 1);
    const everyChanged = every !== m.every; m.every = every;
    const since = v("since");
    const sinceChanged = since && since !== m.since;
    if (since) m.since = since;
    if (m.every > 1) {
      // a new start date (or newly every-N) makes the start date the first dose day
      if (sinceChanged || everyChanged || !state.setupDone) m.anchor = m.since;
      else if (v("anchor")) m.anchor = v("anchor");
    }
    m.packSize = Math.max(1, parseInt(v("packSize"),10) || 28);
    const np = Math.min(m.packSize + 1, Math.max(1, parseInt(v("nextPill"),10) || 1));
    if (np !== m.nextPill){ m.nextPill = np; m.packReset = new Date().toISOString(); }
  });
}

/* ---------- shell ---------- */
function render(){
  if (!state) return;
  if (!state.setupDone) tab = "settings";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = lang === "zh" ? "我的药" : "My Pills";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.getElementById("title").textContent = !state.setupDone ? (lang === "zh" ? "我的药" : "My Pills")
    : t({today:"navToday", pack:"navPack", history:"navHistory", settings:"navSettings"}[tab]);
  document.getElementById("today").textContent = new Date().toLocaleDateString(loc(),{weekday:"long", day:"numeric", month:"long"});
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelector("nav").style.display = state.setupDone ? "" : "none";
  ({today:viewToday, pack:viewPack, history:viewHistory, settings:viewSettings})[tab]();
  showSyncLine();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  if (!state.setupDone) return;
  if (tab === "settings") formError = "";
  tab = b.dataset.tab; render(); window.scrollTo(0,0);
});
let lastDay = todayKey();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayKey() !== lastDay){ lastDay = todayKey(); render(); } });
setInterval(() => { if (todayKey() !== lastDay){ lastDay = todayKey(); render(); } }, 60000);

/* ---------- export / import ---------- */
function deviceName(){ return setting("device") || ""; }
function syncCardHtml(){
  const last = setting("lastExport"), lastIn = setting("lastImport");
  const f = x => x ? fmtDay(keyOf(new Date(x)))+" "+fmtTime(x) : t("never");
  return `<h2>${t("syncTitle")}</h2><div class="card">
    <p class="note" style="margin-top:0">${t("syncBody")}</p>
    <label>${t("phoneName")}</label><input id="devname" placeholder="${esc(t("phoneNamePh"))}" value="${esc(deviceName())}">
    <div class="btnrow" style="margin-top:12px"><button class="btn" data-export>${t("exportBtn")}</button><button class="btn ghost" data-import>${t("importFile")}</button></div>
    <p class="note">${t("lastExport",{a:f(last), b:f(lastIn)})}</p>
    <div style="text-align:right"><button class="link" data-paste>${t("pasteImport")}</button></div>
  </div>`;
}
function wireSync(root){
  const dn = root.querySelector("#devname");
  if (dn) dn.onchange = () => { setting("device", dn.value.trim()); };
  root.querySelectorAll("[data-export]").forEach(b => b.onclick = exportData);
  root.querySelectorAll("[data-import]").forEach(b => b.onclick = pickFile);
  root.querySelectorAll("[data-paste]").forEach(b => b.onclick = pasteSheet);
}
async function exportData(){
  const dn = document.querySelector("#devname"); if (dn) setting("device", dn.value.trim());
  const p = { app:"mypills", format:1, exportedAt:new Date().toISOString(), device:deviceName() || "phone", state };
  const text = JSON.stringify(p, null, 1);
  const dev = (deviceName() || "phone").replace(/[^A-Za-z0-9_-]+/g,"-") || "phone";
  const now = new Date(), fname = `mypills-${dev}-${keyOf(now)}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
  const markDone = () => { setting("lastExport", state.updated || new Date().toISOString()); render(); };
  let file = null;
  try { file = new File([text], fname, {type:"application/json"}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:"My Pills"}); markDone(); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch(e){}
  markDone();
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>${t("exported")}</h3>
    <p class="note">${t("exportedBody",{f:esc(fname)})}</p>
    <div class="btnrow"><button class="btn ghost" data-copy>${t("copyText")}</button><button class="btn" data-x>${t("done")}</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector("[data-copy]").onclick = async (ev) => {
    try { await navigator.clipboard.writeText(text); ev.target.textContent = t("copied"); } catch(e){ ev.target.textContent = t("cantCopy"); }
  };
}
function pickFile(){
  // A real input kept in the page, with no file-type filter: some phones grey out
  // .json files or ignore a picker that isn't attached to the page.
  const inp = document.getElementById("filepick");
  inp.value = ""; inp.click();
}
function onFilePicked(){
  const inp = document.getElementById("filepick");
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => handleImport(String(r.result));
  r.onerror = () => importError(t("readFail"));
  r.readAsText(f);
}
function pasteSheet(){
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>${t("pasteTitle")}</h3>
    <p class="note">${t("pasteBody")}</p>
    <textarea id="pastebox" style="width:100%;height:140px;font:13px monospace;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px"></textarea>
    <div class="btnrow"><button class="btn ghost" data-x>${t("cancel")}</button><button class="btn" data-ok>${t("importBtn")}</button></div></div></div>`;
  d.querySelector("[data-x]").onclick = closeDlg;
  d.querySelector("[data-ok]").onclick = () => { const v = d.querySelector("#pastebox").value; closeDlg(); handleImport(v); };
}
function importError(msg){ infoSheet(t("importFailed"), esc(msg)); }
function validState(s){
  return s && Array.isArray(s.meds) && Array.isArray(s.log) &&
    s.meds.every(m => m && typeof m.id === "string" && typeof m.name === "string" && Number.isFinite(+m.packSize) && Number.isFinite(+m.nextPill)) &&
    s.log.every(e => e && typeof e.id === "string" && typeof e.med === "string" && /^\d{4}-\d\d-\d\d$/.test(e.date));
}
function handleImport(text){
  let p; try { p = JSON.parse(text.trim()); } catch(e){ return importError(t("notOurFile")); }
  const inc = p && p.app === "mypills" ? p.state : p;
  if (!validState(inc)) return importError(t("notOurFile"));
  inc.setupDone = true;
  const doses = inc.log.filter(e => !e.skipped).length;
  const when = p.exportedAt ? fmtDay(keyOf(new Date(p.exportedAt))) + " " + fmtTime(p.exportedAt) : t("unknownTime");
  const finish = (newState, how) => {
    state = newState; state.updated = new Date().toISOString(); saveLocal(); formError = "";
    setting("lastImport", new Date().toISOString());
    tab = "pack"; render();
    infoSheet(t("imported"), t("importedBody",{how}));
  };
  const fresh = !state.setupDone;
  const d = document.getElementById("dlg");
  d.innerHTML = `<div class="scrim"><div class="sheet"><h3>${t("importTitle")}</h3>
    <p class="note">${t("importSummary",{dev:esc(p.device || t("anotherPhone")), when, m:inc.meds.length, d:doses})}</p>
    ${fresh ? "" : `<p class="note">${t("combineExplain")}</p>`}
    <div class="btnrow">${fresh ? `<button class="btn ghost" data-x>${t("cancel")}</button><button class="btn" data-merge>${t("importBtn")}</button>`
      : `<button class="btn ghost" data-replace>${t("replace")}</button><button class="btn" data-merge>${t("combine")}</button>`}</div>
    ${fresh ? "" : `<div style="text-align:center;margin-top:8px"><button class="link" data-x>${t("cancel")}</button></div>`}</div></div>`;
  d.querySelectorAll("[data-x]").forEach(b => b.onclick = closeDlg);
  d.querySelector("[data-merge]").onclick = () => { closeDlg(); finish(mergeStates(state, JSON.parse(JSON.stringify(inc))), fresh ? t("howImported") : t("howCombined")); };
  const rb = d.querySelector("[data-replace]");
  if (rb) rb.onclick = () => { closeDlg(); confirmSheet(t("replaceTitle"), t("replaceBody"), t("replace"), () => finish(JSON.parse(JSON.stringify(inc)), t("howReplaced"))); };
}

/* ---------- merge two phones' data ---------- */
// Doses recorded on either phone are kept. Undos are remembered so they don't come back.
// Medicine settings come from whichever was saved last.
function mergeStates(local, remote){
  if (!local || !local.setupDone) return remote;
  if (!remote || !remote.setupDone) return local;
  const newer = (remote.updated || "") >= (local.updated || "") ? remote : local;
  const out = JSON.parse(JSON.stringify(newer));
  const removed = new Set([...(local.removed||[]), ...(remote.removed||[])]);
  const byKey = new Map();
  [...newer.log, ...(newer === remote ? local.log : remote.log)].forEach(e => {
    if (removed.has(e.id)) return;
    const k = e.med + "|" + e.date;
    if (!byKey.has(k)) byKey.set(k, e);
  });
  out.log = [...byKey.values()];
  out.removed = [...removed].slice(-300);
  out.updated = newer.updated;
  out.meds.forEach(m => {
    out.log.forEach(e => { if (e.med === m.id && !e.skipped && e.pill >= m.nextPill && e.at > (m.packReset || "")) m.nextPill = e.pill + 1; });
  });
  return out;
}

/* ---------- boot ---------- */
state = loadLocal() || defaultState();
if (!state.setupDone && !state.meds.length) state.meds.push(newMed());
document.getElementById("filepick").addEventListener("change", onFilePicked);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
})();
</script>
